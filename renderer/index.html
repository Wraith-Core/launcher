<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://cdn.discordapp.com https://avatars.steamstatic.com https://avatars.akamai.steamstatic.com https://avatars.cloudflare.steamstatic.com; font-src 'self'; media-src 'self'">
  <title>Wraith Core</title>
  <link rel="stylesheet" href="theme/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- layers, back to front: the survey plate, the scrims, the grain, the type (as the loading screen) -->
  <div class="plates" id="plates" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="ui">
    <header class="mast">
      <span class="mast-mark" dir="ltr">WRAITH CORE</span>
      <span class="mast-rule"></span>
      <span class="mast-item" id="m-status"><i class="dot"></i><span>جاري الفحص</span></span>
      <span class="mast-item">اللاعبون <b class="fig" id="m-players">—</b></span>
      <span class="mast-item">البنق <b class="fig" id="m-ping">—</b></span>
      <button class="mast-upd" id="upd" hidden title="تحديث اللانشر"><i class="upd-dot"></i><span id="upd-text"></span></button>
      <button class="mast-btn" id="music-btn" title="الموسيقى">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
        <span id="music-state">الموسيقى</span>
      </button>
      <div class="win">
        <button id="win-min" title="تصغير"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button id="win-close" title="إغلاق"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </header>

    <p class="caption" id="caption">
      <span class="cap-title" id="cap-title"></span>
      <span class="cap-credit" id="cap-credit" dir="ltr"></span>
    </p>

    <aside class="me" id="me" hidden>
      <div class="me-wrap">
        <div class="me-card">
          <span class="me-avatar" id="me-avatar"></span>
          <div class="me-main">
            <b class="me-name" id="me-name"></b>
            <span class="me-state" id="me-state"></span>
          </div>
          <div class="me-stats">
            <span><b class="fig" id="me-hours">0</b><small>ساعة لعب</small></span>
            <span><b id="me-since">—</b><small>أول دخول</small></span>
          </div>
        </div>
      </div>
    </aside>

    <section class="mark">
      <p class="welcome"><span id="greet">مساء الخير</span>، أهلاً بك</p>
      <h1 class="wordmark">
        <span class="wm-primary" dir="ltr" id="wm-primary">WRAITH CORE</span>
        <span class="wm-second" id="wm-second">ريث كور</span>
      </h1>
      <p class="tagline" id="tagline">سيرفر رول بلاي عربي على RedM</p>

      <div class="actions">
        <button class="plate-btn is-primary" id="play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <i class="in-dot"></i>
          <span id="play-text">ادخل السيرفر</span>
        </button>
        <button class="plate-btn" id="btn-leave" hidden>خروج من اللعبة</button>
        <button class="plate-btn" id="btn-updates" data-board="updates">التحديثات<i class="attn" id="attn" hidden></i></button>
        <button class="plate-btn" data-board="players">اللاعبون</button>
        <button class="plate-btn" id="btn-discord" hidden>الدسكورد</button>
      </div>
      <p class="redm" id="redm-note"></p>
    </section>

    <aside class="tip" id="tip" hidden>
      <div class="tip-head">
        <span class="tip-title"><svg class="star" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0l1.2 3.8L10 5 6.2 6.2 5 10 3.8 6.2 0 5l3.8-1.2z"/></svg><span>من سجل التحديثات</span></span>
        <span class="tip-count fig" id="tip-count" dir="ltr"></span>
      </div>
      <p class="tip-sys" id="tip-sys"></p>
      <p class="tip-text" id="tip-text"></p>
    </aside>

    <footer class="load" id="load">
      <div class="load-row">
        <span class="status" id="load-status">جاري الاتصال بالسيرفر…</span>
        <span class="pct fig" dir="ltr"><b id="pct-num">0</b><small id="pct-max">/ 48</small></span>
      </div>
      <div class="track" id="track"><i class="fill"></i><i class="tick"></i></div>
    </footer>

    <p class="legal">
      <span dir="ltr">Wraith Core is not approved, sponsored, or endorsed by Rockstar Games.</span>
      <span id="legal-right" dir="ltr"></span>
    </p>
  </div>

  <!-- the board: one torn ink card, as the pause menu -->
  <div class="board-scrim" id="board-scrim" hidden></div>
  <aside class="board" id="board" hidden>
    <div class="board-wrap">
      <div class="board-card">
        <header class="board-head">
          <h2 id="board-title"></h2>
          <span class="board-note fig" id="board-note"></span>
          <button class="board-close" id="board-close" title="إغلاق"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
        </header>
        <label class="board-search" id="board-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="search" type="search" placeholder="ابحث في التحديثات" autocomplete="off" spellcheck="false">
        </label>
        <div class="board-body" id="board-body"></div>
      </div>
    </div>
  </aside>

  <div class="note-wrap" id="toast" hidden>
    <div class="note">
      <span id="toast-text"></span>
      <button id="toast-action" hidden></button>
    </div>
  </div>

  <script src="plates.js"></script>
  <script src="app.js"></script>
</body>
</html>
